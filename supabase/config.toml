additional_redirect_urls = ["https://mucknjogja.vercel.app/", "http://localhost:5173/", "http://127.0.0.1:5173/", "https://mucknjogja.vercel.app/trainer", "http://localhost:5173/trainer", "http://127.0.0.1:5173/trainer"]

